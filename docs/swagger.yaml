basePath: /api
definitions:
  models.CreateUserRequest:
    properties:
      first_name:
        example: Дина
        type: string
      last_name:
        example: Алмазова
        type: string
      login:
        example: dina@gmail.com
        type: string
      password:
        minLength: 8
        type: string
    required:
    - first_name
    - last_name
    - login
    - password
    type: object
  models.LoginRequest:
    properties:
      login:
        example: dina@gmail.com
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  models.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.ServerResponse:
    properties:
      data: {}
      error:
        example: Пользователь с таким логином уже существует
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  models.UpdateUserRequest:
    properties:
      first_name:
        example: Дана
        minLength: 2
        type: string
      last_name:
        example: Алмасова
        minLength: 2
        type: string
      login:
        example: dina1@gmail.com
        minLength: 3
        type: string
      password:
        example: NewPassword456!
        minLength: 8
        type: string
    type: object
  models.User:
    properties:
      first_name:
        example: Дина
        type: string
      last_login:
        example: "2026-01-28T12:30:45+05:00"
        type: string
      last_name:
        example: Алмазова
        type: string
      login:
        example: dina@gmail.com
        type: string
      user_id:
        example: 1
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: akbota.bolat678@gmail.com
    name: akbota
  description: CRUD управления пользователями с JWT аутентификацией
  title: User Test
  version: "1.0"
paths:
  /users:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает список всех зарегистрированных пользователей. Требует JWT аутентификации.

        **Пример запроса curl:**
        ```bash
        curl -X GET "http://localhost:8080/api/users" -H "Authorization: Bearer $TOKEN"
        ```
      produces:
      - application/json
      responses:
        "200":
          description: Список пользователей
          schema:
            allOf:
            - $ref: '#/definitions/models.ServerResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.ServerResponse'
      security:
      - BearerAuth: []
      summary: "\U0001F465 Получить всех пользователей"
      tags:
      - Пользователи
    post:
      consumes:
      - application/json
      description: |-
        Создает нового пользователя в системе. Логин должен быть уникальным.
        **Пример запроса curl:**
        ```bash
        curl -X POST "http://localhost:8080/api/users" -H "Content-Type: application/json" -d '{
        "first_name": "Иван",
        "last_name": "Петров",
        "login": "ivan@example.com",
        "password": "Password123!"
        }'
        ```
      parameters:
      - description: Данные нового пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь успешно создан
          schema:
            allOf:
            - $ref: '#/definitions/models.ServerResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверный формат данных
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "409":
          description: Пользователь с таким логином уже существует
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/models.ServerResponse'
      summary: "\U0001F4DD Регистрация нового пользователя"
      tags:
      - Пользователи
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет пользователя из системы. Требует JWT аутентификации.
      parameters:
      - description: ID пользователя
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь удален
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ServerResponse'
      security:
      - BearerAuth: []
      summary: "\U0001F5D1️ Удалить пользователя"
      tags:
      - Пользователи
    get:
      consumes:
      - application/json
      description: Возвращает информацию о конкретном пользователе. Требует JWT аутентификации.
      parameters:
      - description: ID пользователя
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные пользователя
          schema:
            allOf:
            - $ref: '#/definitions/models.ServerResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ServerResponse'
      security:
      - BearerAuth: []
      summary: "\U0001F50D Получить пользователя по ID"
      tags:
      - Пользователи
    put:
      consumes:
      - application/json
      description: Обновляет информацию о пользователе. Все поля опциональны. Требует
        JWT аутентификации.
      parameters:
      - description: ID пользователя
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь обновлен
          schema:
            allOf:
            - $ref: '#/definitions/models.ServerResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "409":
          description: Логин уже занят
          schema:
            $ref: '#/definitions/models.ServerResponse'
      security:
      - BearerAuth: []
      summary: ✏️ Обновить пользователя
      tags:
      - Пользователи
  /users/login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя по логину и паролю, возвращает JWT
        токен
      parameters:
      - description: Учетные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход
          schema:
            allOf:
            - $ref: '#/definitions/models.ServerResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.LoginResponse'
              type: object
        "400":
          description: Неверный формат данных
          schema:
            $ref: '#/definitions/models.ServerResponse'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/models.ServerResponse'
      summary: "\U0001F510 Вход в систему"
      tags:
      - Аутентификация
securityDefinitions:
  BearerAuth:
    description: 'Введите "Bearer" затем пробел и ваш JWT токен. Пример: `Bearer eyJhbGciOiJIUzI1NiIs...`'
    in: header
    name: just simple project
    type: apiKey
swagger: "2.0"
